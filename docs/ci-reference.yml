name: CI — Phase 5G

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase5g-confirmation-race-guard]

env:
  NODE_ENV: test
  DATABASE_URL: file:./test.db

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:push
      - run: bun run db:seed
      - name: Run SQLite test suite
        run: bun run test

  test-paystack:
    runs-on: ubuntu-latest
    if: secrets.PAYSTACK_SECRET_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:push
      - run: bun run db:seed
      - name: Run Paystack sandbox acceptance tests
        run: bun vitest run src/__tests__/phase5g-sandbox-acceptance.test.ts

  test-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: applecalendar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:generate:postgres
      - name: Run Prisma migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/applecalendar_test?schema=public
        run: bunx prisma migrate deploy --schema=prisma/schema.postgresql.prisma
      - name: Run PostgreSQL concurrency suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/applecalendar_test?schema=public
          NODE_ENV: test
        run: bun vitest run src/__tests__/phase5g-postgresql-concurrency.test.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
